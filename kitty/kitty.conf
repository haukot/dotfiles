pixel_scroll yes
shell /usr/bin/zsh
font_size 13.0
font_family Ubuntu Sans Mono
momentum_scroll 0
enable_audio_bell no
window_alert_on_bell no
hide_window_decorations yes
window_title_bar_min_windows 1
window_title_bar_active_background #303030
window_title_bar_inactive_background #303030
window_title_bar_active_foreground #ffffff
window_title_bar_inactive_foreground #cccccc

# Let Herdr handle workspace and tab shortcuts.
map ctrl+shift+n no_op
map ctrl+shift+q no_op
map ctrl+shift+t no_op
map ctrl+shift+w no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op

# Match GNOME Terminal's Yaru colors and profile palette.
background #300a24
foreground #dddddd
color0 #524520
color1 #c01c28
color2 #26a269
color3 #a2734c
color4 #268bd2
color5 #a347ba
color6 #2aa1b3
color7 #d0cfcc
color8 #5e5c64
color9 #f66151
color10 #33d17a
color11 #e9ad0c
color12 #2a7bde
color13 #c061cb
color14 #33c7de
color15 #ffffff
